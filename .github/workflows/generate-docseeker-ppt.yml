name: Generate DocSeeker compact PPT

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare_docseeker_assets.py
      - scripts/generate_docseeker_ppt.py
      - scripts/validate_docseeker_ppt.py
      - .github/workflows/generate-docseeker-ppt.yml
      - requirements.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PPT generation dependencies
        run: python -m pip install -r requirements.txt
      - name: Download paper and prepare runtime figure/table assets
        run: python scripts/prepare_docseeker_assets.py
      - name: Generate PPTX
        run: python scripts/generate_docseeker_ppt.py
      - name: Validate PPTX
        run: python scripts/validate_docseeker_ppt.py
      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: docseeker_compact_pptx
          path: outputs/docseeker_compact_ppt.pptx
          if-no-files-found: error
