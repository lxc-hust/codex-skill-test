name: Generate DocSeeker Chinese PPT

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_docseeker_ppt.py'
      - '.github/workflows/generate-docseeker-ppt.yml'

jobs:
  build-ppt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-pptx pillow pymupdf

      - name: Generate and validate PPTX
        run: |
          python scripts/generate_docseeker_ppt.py --force-download

      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: docseeker-chinese-academic-ppt
          path: outputs/docseeker/DocSeeker_Chinese_Academic_PPT.pptx
          if-no-files-found: error
