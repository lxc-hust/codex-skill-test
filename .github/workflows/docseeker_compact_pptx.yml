name: docseeker_compact_pptx

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_docseeker_ppt.py"
      - "scripts/validate_docseeker_ppt.py"
      - "requirements.txt"
      - ".github/workflows/docseeker_compact_pptx.yml"

jobs:
  build-pptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generation dependencies
        run: python -m pip install -r requirements.txt
      - name: Download paper, crop figures/tables, and generate PPTX
        run: python scripts/generate_docseeker_ppt.py
      - name: Validate PPTX with python-pptx and zip integrity
        run: |
          python scripts/validate_docseeker_ppt.py
          unzip -t outputs/docseeker_compact_ppt.pptx
      - name: Upload compact PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: docseeker_compact_pptx
          path: outputs/docseeker_compact_ppt.pptx
